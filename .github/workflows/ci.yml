name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:

jobs:
  check-and-publish:
    runs-on: [self-hosted, nixos]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check
        run: nix flake check --print-build-logs
      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build
      - name: Publish image
        if: github.event_name == 'push'
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          umask 077
          authfile="$RUNNER_TEMP/skopeo-auth-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          trap 'rm -f "$authfile"' EXIT
          image="$(nix build .#dockerImage --print-out-paths --no-link)"
          printf '%s' "$GHCR_TOKEN" | nix develop -c skopeo login \
            --authfile "$authfile" --username "$GITHUB_ACTOR" --password-stdin ghcr.io

          tag="${GITHUB_REF_NAME//\//-}"
          if [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == "$GITHUB_DEFAULT_BRANCH" ]]; then
            tag=latest
          fi
          nix develop -c skopeo copy --authfile "$authfile" \
            "docker-archive:$image" "docker://$IMAGE_NAME:$tag"
